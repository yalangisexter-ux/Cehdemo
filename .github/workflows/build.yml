name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate Android Project
        run: |
          python advanced_build.py
          echo "=== Filesystem after generation ==="
          find . -maxdepth 4 -type f | sort | head -200

      - name: Detect Project Root
        run: |
          if [ -f "output/generated_project/app/build.gradle" ] || [ -f "output/generated_project/app/build.gradle.kts" ]; then
            PROJECT_ROOT="output/generated_project"
          elif [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            PROJECT_ROOT="."
          else
            echo "ERROR: Android project was not found."
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected project root: $PROJECT_ROOT"

      - name: Verify Project Root
        run: |
          cd "$PROJECT_ROOT"
          pwd
          ls -la
          if [ ! -d app ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

      - name: Install Exact Gradle 8.2
        run: |
          curl -fL -o /tmp/gradle-8.2-bin.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle-8.2-bin.zip -d /tmp
          /tmp/gradle-8.2/bin/gradle --version

      - name: Generate Gradle Wrapper
        run: |
          cd "$PROJECT_ROOT"
          mkdir -p gradle/wrapper
          /tmp/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: Gradle wrapper JAR was not generated."
            exit 1
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: Gradle wrapper properties were not generated."
            exit 1
          fi
          ls -la gradle/wrapper/

      - name: Fix settings.gradle and create gradle.properties
        run: |
          cd "$PROJECT_ROOT"
          
          # Create settings.gradle
          cat > settings.gradle <<'GRADLE'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Cehdemo"
          include(":app")
          GRADLE
          
          # Create gradle.properties - THIS IS THE FIX
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          PROPS
          
          cat settings.gradle
          cat gradle.properties

      - name: Patch app build.gradle
        run: |
          cd "$PROJECT_ROOT"
          if [ -f app/build.gradle ]; then
            sed -i '/versionNameSuffix/d' app/build.gradle
            cat app/build.gradle
          elif [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          else
            echo "ERROR: app build file not found."
            exit 1
          fi

      - name: Repair AndroidManifest.xml
        run: |
          cd "$PROJECT_ROOT"
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml was not generated."
            exit 1
          fi
          python -c '
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"^\s*\`\`\`(?:xml)?\s*", "", text, flags=re.IGNORECASE)
          text = re.sub(r"\s*\`\`\`\s*$", "", text)
          start = text.find("<?xml")
          if start >= 0:
              text = text[start:]
          else:
              start = text.find("<manifest")
              if start >= 0:
                  text = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n" + text[start:]
          manifest.write_text(text.strip() + "\n", encoding="utf-8")
          try:
              ET.parse(manifest)
              print("Manifest XML is valid.")
          except ET.ParseError as exc:
              print("Manifest XML is invalid:", exc)
              package_name = None
              for source_root in [Path("app/src/main/java"), Path("app/src/main/kotlin")]:
                  if not source_root.exists():
                      continue
                  for source in source_root.rglob("MainActivity.*"):
                      source_text = source.read_text(encoding="utf-8", errors="ignore")
                      match = re.search(r"(?m)^\s*package\s+([A-Za-z0-9_.]+)", source_text)
                      if match:
                          package_name = match.group(1)
                          break
                  if package_name:
                      break
              if not package_name:
                  build_file = Path("app/build.gradle")
                  if build_file.exists():
                      build_text = build_file.read_text(encoding="utf-8", errors="ignore")
                      match = re.search(r"applicationId\s*[= ]\s*[\"\\x27]([^\"\\x27]+)[\"\\x27]", build_text)
                      if match:
                          package_name = match.group(1)
              if not package_name:
                  package_name = "com.example.cehdemo"
              clean_manifest = """<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"__PACKAGE__\">
              <application android:allowBackup=\"true\" android:label=\"Cehdemo\" android:supportsRtl=\"true\" android:theme=\"@android:style/Theme.Material.Light\">
                  <activity android:name=\".MainActivity\" android:exported=\"true\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """
              manifest.write_text(clean_manifest.replace("__PACKAGE__", package_name), encoding="utf-8")
              ET.parse(manifest)
              print("Safe manifest created for:", package_name)
          '
          cat "$MANIFEST"

      - name: Remove Missing Launcher Icon References
        run: |
          cd "$PROJECT_ROOT"
          python -c '
          import re
          from pathlib import Path
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8", errors="replace")
          res = Path("app/src/main/res")
          has_icon = False
          if res.exists():
              for pattern in ("mipmap*/ic_launcher*", "drawable*/ic_launcher*"):
                  if any(p.is_file() for p in res.glob(pattern)):
                      has_icon = True
                      break
          if not has_icon:
              text = re.sub(r"\s+android:(?:icon|roundIcon)\s*=\s*\"@mipmap/ic_launcher(?:_round)?\"", "", text)
              manifest.write_text(text, encoding="utf-8")
              print("No launcher icon resource found. Removed icon references.")
          else:
              print("Launcher icon resource exists. Keeping icon references.")
          '

      - name: Validate Gradle Configuration
        run: |
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew tasks --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          cd "$PROJECT_ROOT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "=== APK successfully generated ==="
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Generated Android Project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROJECT_ROOT/app" "$PROJECT_ROOT/build.gradle" "$PROJECT_ROOT/settings.gradle" "$PROJECT_ROOT/gradle" "$PROJECT_ROOT/gradlew" "$PROJECT_ROOT/gradlew.bat" "$PROJECT_ROOT/gradle.properties"
          if git diff --cached --quiet; then
            echo "No generated Android project changes."
          else
            git commit -m "Update generated Android project [skip ci]"
            git push
          fi
