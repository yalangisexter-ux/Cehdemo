name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate Android Project
        run: |
          python advanced_build.py

          echo "=== Generated Android project ==="
          find app -maxdepth 5 -type f -print || true

      - name: Fix settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Cehdemo"
          include(":app")
          EOF

          cat settings.gradle

      - name: Patch app build.gradle
        run: |
          if [ -f app/build.gradle ]; then
            sed -i '/versionNameSuffix/d' app/build.gradle
          fi

          echo "=== app/build.gradle ==="
          cat app/build.gradle

      - name: Repair AndroidManifest.xml
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml was not generated."
            exit 1
          fi

          echo "=== Original AndroidManifest.xml ==="
          cat "$MANIFEST"

          python - <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8", errors="replace")

          # Remove accidental Markdown fences.
          text = re.sub(r"^\s*```(?:xml)?\s*", "", text, flags=re.IGNORECASE)
          text = re.sub(r"\s*```\s*$", "", text)

          # Remove junk before the XML document/root.
          start = text.find("<?xml")
          if start >= 0:
              text = text[start:]
          else:
              start = text.find("<manifest")
              if start >= 0:
                  text = '<?xml version="1.0" encoding="utf-8"?>\n' + text[start:]

          manifest.write_text(text.strip() + "\n", encoding="utf-8")

          try:
              ET.parse(manifest)
          except ET.ParseError:
              print("Manifest XML is invalid. Creating a clean minimal manifest.")

              package_name = None

              for root in [Path("app/src/main/java"), Path("app/src/main/kotlin")]:
                  if root.exists():
                      for source in root.rglob("MainActivity.*"):
                          source_text = source.read_text(
                              encoding="utf-8", errors="ignore"
                          )
                          match = re.search(
                              r"(?m)^\s*package\s+([A-Za-z0-9_.]+)",
                              source_text
                          )
                          if match:
                              package_name = match.group(1)
                              break
                  if package_name:
                      break

              if not package_name:
                  build_file = Path("app/build.gradle")
                  if build_file.exists():
                      build_text = build_file.read_text(
                          encoding="utf-8", errors="ignore"
                      )
                      match = re.search(
                          r'applicationId\s*[= ]\s*["\']([^"\']+)["\']',
                          build_text
                      )
                      if match:
                          package_name = match.group(1)

              package_name = package_name or "com.example.cehdemo"

              clean_manifest = f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="{package_name}">
              <application
                  android:allowBackup="true"
                  android:label="Cehdemo"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          '''

              clean_manifest = "\n".join(
                  line.strip() if line.strip() else ""
                  for line in clean_manifest.splitlines()
              )

              manifest.write_text(clean_manifest + "\n", encoding="utf-8")

          # The actual build failure was a missing mipmap/ic_launcher.
          # Remove only missing launcher icon references; do not replace the
          # rest of the generated manifest.
          text = manifest.read_text(encoding="utf-8", errors="replace")
          text = re.sub(r'\s+android:icon\s*=\s*["\']@mipmap/ic_launcher["\']', '', text)
          text = re.sub(r'\s+android:roundIcon\s*=\s*["\']@mipmap/ic_launcher_round["\']', '', text)
          manifest.write_text(text, encoding="utf-8")

          ET.parse(manifest)
          print("Manifest XML is valid and missing launcher icon references were removed.")
          PY

          echo "=== Final AndroidManifest.xml ==="
          cat "$MANIFEST"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Gradle 8.2
        run: |
          curl -fL             -o /tmp/gradle-8.2-bin.zip             https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle-8.2-bin.zip -d /tmp

      - name: Generate Gradle Wrapper
        run: |
          /tmp/gradle-8.2/bin/gradle wrapper --gradle-version 8.2

      - name: Make gradlew executable
        run: |
          chmod +x gradlew

      - name: Verify Gradle Wrapper
        run: |
          ls -la gradlew
          ls -la gradle/wrapper/

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit generated Android project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app build.gradle settings.gradle gradle gradlew gradlew.bat

          if git diff --cached --quiet; then
            echo "No generated Android project changes to commit."
          else
            git commit -m "Commit generated Android project [skip ci]"
            git push
          fi
