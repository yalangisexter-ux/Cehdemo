name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Android Project
        run: |
          python advanced_build.py

          echo "=== Generated project ==="
          find output/generated_project -maxdepth 4 -type f -print

          echo "=== Generated settings.gradle ==="
          if [ -f output/generated_project/settings.gradle ]; then
            cat output/generated_project/settings.gradle
          elif [ -f output/generated_project/settings.gradle.kts ]; then
            echo "settings.gradle.kts found:"
            cat output/generated_project/settings.gradle.kts
          else
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Gradle 8.2
        run: |
          curl -fL \
            -o /tmp/gradle-8.2-bin.zip \
            https://services.gradle.org/distributions/gradle-8.2-bin.zip

          unzip -q /tmp/gradle-8.2-bin.zip -d /tmp

      - name: Generate Gradle Wrapper
        run: |
          /tmp/gradle-8.2/bin/gradle \
            -p output/generated_project \
            wrapper \
            --gradle-version 8.2

      - name: Make gradlew executable
        run: |
          chmod +x output/generated_project/gradlew

      - name: Verify Gradle Wrapper
        run: |
          ls -la output/generated_project/gradlew
          ls -la output/generated_project/gradle/wrapper/

      - name: Build Debug APK
        working-directory: output/generated_project
        run: |
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output/generated_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
