name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Android Project
        run: |
          python advanced_build.py

          echo "=== Generated files ==="
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            -print

      - name: Fix generated settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Cehdemo"
          include(":app")
          EOF

          echo "=== Fixed settings.gradle ==="
          cat settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Gradle 8.2
        run: |
          curl -fL \
            -o /tmp/gradle-8.2-bin.zip \
            https://services.gradle.org/distributions/gradle-8.2-bin.zip

          unzip -q /tmp/gradle-8.2-bin.zip -d /tmp

      - name: Generate Gradle Wrapper
        run: |
          /tmp/gradle-8.2/bin/gradle \
            wrapper \
            --gradle-version 8.2

      - name: Make gradlew executable
        run: |
          chmod +x gradlew

      - name: Verify Gradle Wrapper
        run: |
          echo "=== gradlew ==="
          ls -la gradlew

          echo "=== Gradle wrapper files ==="
          ls -la gradle/wrapper/

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
